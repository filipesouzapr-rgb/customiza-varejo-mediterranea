name: Backup diário do banco

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 03:00 America/Sao_Paulo
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/backup.yml']

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instala cliente Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Gera o dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          data=$(date +%Y-%m-%d)
          url=$(printf '%s' "$DATABASE_URL" | tr -d '[:space:]')
          pg_dump "$url" --no-owner --no-privileges -Fc -f "backup-$data.dump"

      - name: Sobe o backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 30
