name: Backup diário do banco

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 03:00 America/Sao_Paulo
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instala cliente Postgres
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          # instala a versao de cliente mais recente disponivel, pra acompanhar upgrades do servidor
          sudo apt-cache search 'postgresql-client-[0-9]+$' | grep -oE 'postgresql-client-[0-9]+' | sort -Vu | tail -1 | xargs sudo apt-get install -y

      - name: Gera o dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          data=$(date +%Y-%m-%d)
          url=$(printf '%s' "$DATABASE_URL" | tr -d '[:space:]')
          # usa o pg_dump mais novo instalado, o runner do GitHub ja vem com um mais antigo fora do sistema de alternatives
          pgdump=$(ls -d /usr/lib/postgresql/*/bin/pg_dump | sort -V | tail -1)
          "$pgdump" "$url" --no-owner --no-privileges -Fc -f "backup-$data.dump"

      - name: Sobe o backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-*.dump
          retention-days: 30
